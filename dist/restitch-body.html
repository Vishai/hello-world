/** Mini SVG rendering of an artwork's components. */
function artworkThumb(artwork, size = 96) {
  const svg = svgEl('svg', { viewBox: computeViewBox(artwork), width: '100%', height: '72' });
  for (const c of artwork.components) {
    const g = svgEl('g', {
      transform: `translate(${c.offsetMm?.x ?? 0} ${c.offsetMm?.y ?? 0}) rotate(${c.rotation ?? 0})`,
    });
    g.append(svgEl('path', { d: c.pathMm, fill: roleColor(c.role), stroke: '#14110f', 'stroke-width': 1 }));
    svg.append(g);
  }
  return svg;
}

function roleColor(role) {
  return { petal: '#7d9bc0', center: '#e3c25a', leaf: '#7fae7a', stem: '#7fae7a', body: '#c0847d' }[role] || '#a89e93';
}

function computeViewBox(artwork) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of artwork.components) {
    // conservative: bbox center offset ± half diagonal covers any rotation
    const ox = c.offsetMm?.x ?? 0, oy = c.offsetMm?.y ?? 0;
    const reach = Math.hypot(
      Math.max(Math.abs(c.bboxMm.x), Math.abs(c.bboxMm.x + c.bboxMm.w)),
      Math.max(Math.abs(c.bboxMm.y), Math.abs(c.bboxMm.y + c.bboxMm.h)));
    minX = Math.min(minX, ox - reach); maxX = Math.max(maxX, ox + reach);
    minY = Math.min(minY, oy - reach); maxY = Math.max(maxY, oy + reach);
  }
  const pd = 4;
  return `${minX - pd} ${minY - pd} ${maxX - minX + pd * 2} ${maxY - minY + pd * 2}`;
}

/** Import an uploaded file into artwork components. */
async function importFile(file) {
  if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) {
    const text = await file.text();
    const fromPaths = importSvgPaths(text);
    if (fromPaths) return fromPaths;
    // Fallback: rasterize the SVG and trace its silhouette.
    const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(text)));
    const img = await loadImage(url);
    return traceToArtwork(img, file.name);
  }
  const dataUrl = await fileToDataURL(file, 1000);
  const img = await loadImage(dataUrl);
  return traceToArtwork(img, file.name);
}

function traceToArtwork(img, name) {
  const traced = ai.traceArtwork(img, { targetWMm: 100 });
  if (!traced) return null;
  return {
    name: name.replace(/\.[^.]+$/, '') || 'Traced artwork',
    components: [{
      name: 'Traced shape', role: 'body',
      pathMm: traced.pathMm, bboxMm: traced.bboxMm,
      offsetMm: { x: 0, y: 0 }, quantity: 1,
    }],
  };
}

/**
 * Native vector import for simple flat SVGs: top-level paths with no
 * transforms. Anything more complex falls back to raster tracing.
 * Uses a temporarily-attached hidden <svg> so getBBox() works.
 */
function importSvgPaths(text) {
  let doc;
  try {
    doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  } catch { return null; }
  if (doc.querySelector('parsererror')) return null;
  if (doc.querySelector('[transform]')) return null; // keep MVP import predictable
  const paths = [...doc.querySelectorAll('path')].slice(0, 16);
  if (!paths.length) return null;

  const probe = svgEl('svg', { style: 'position:absolute;width:0;height:0;overflow:hidden' });
  document.body.append(probe);
  try {
    // Measure, then resample each path into our canonical geometry format
    // (absolute mm coordinates, closed smooth path) so downstream code has a
    // single path representation for rendering AND cutting.
    const measured = paths.map((p) => {
      const clone = svgEl('path', { d: p.getAttribute('d') || '' });
      probe.append(clone);
      const bb = clone.getBBox();
      return { node: clone, bb };
    }).filter(({ bb }) => bb.width > 0 && bb.height > 0);
    if (!measured.length) return null;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const { bb } of measured) {
      minX = Math.min(minX, bb.x); maxX = Math.max(maxX, bb.x + bb.width);
      minY = Math.min(minY, bb.y); maxY = Math.max(maxY, bb.y + bb.height);
    }
    const wUnits = maxX - minX;
    if (!(wUnits > 0)) return null;
    const mmPerUnit = 100 / wUnits; // normalize artwork to 100 mm wide
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    const components = [];
    measured.forEach(({ node, bb }, i) => {
      const len = node.getTotalLength();
      if (!(len > 0)) return;
      const n = Math.min(240, Math.max(48, Math.round(len / (wUnits / 60))));
      // Re-center each component on its own bbox center: piece transforms
      // (rotate/scale) act about the path's local origin, and offsetMm
      // preserves the arrangement inside the artwork.
      const compCx = bb.x + bb.width / 2, compCy = bb.y + bb.height / 2;
      const pts = [];
      for (let k = 0; k < n; k++) {
        const pt = node.getPointAtLength((len * k) / n);
        pts.push([(pt.x - compCx) * mmPerUnit, (pt.y - compCy) * mmPerUnit]);
      }
      const simplified = simplifyPolyline(pts, 0.4);
      if (simplified.length < 3) return;
      const pathMm = smoothClosedPath(simplified, 0.8);
      components.push({
        name: `Path ${i + 1}`, role: 'body',
        pathMm,
        bboxMm: pathBBox(pathMm),
        offsetMm: {
          x: (bb.x + bb.width / 2 - cx) * mmPerUnit,
          y: (bb.y + bb.height / 2 - cy) * mmPerUnit,
        },
        quantity: 1,
      });
    });
    if (!components.length) return null;
    return { name: 'Imported SVG', components };
  } finally {
    probe.remove();
  }
}

/** Show the decomposition, let the user tweak size, then add to the design. */
function confirmArtwork(artwork, pad) {
  const p = state.project;
  const sizeInput = el('input', { type: 'range', min: 30, max: 220, value: 100 });
  const thumbHolder = el('div', { class: 'photo-frame', style: 'background:#fff; padding:8px' });
  thumbHolder.append(artworkThumb(artwork));

  const pieceList = el('div', { class: 'muted' }, describeComponents(artwork));

  const content = el('div', {},
    thumbHolder,
    el('div', { class: 'section-title' }, 'Cuttable pieces'),
    pieceList,
    el('div', { class: 'small-note' }, 'You can resize, retexture, duplicate or delete each piece in the designer.'),
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn', onclick: () => { addToDesign(artwork); modal.close(); navigate(`#/p/${p.id}/designer`); } },
        'Add to design'),
      el('button', { class: 'btn secondary', onclick: () => modal.close() }, 'Cancel'),
    ),
  );
  const modal = showModal(artwork.name, content);
}

function describeComponents(artwork) {
  const byRole = {};
  for (const c of artwork.components) byRole[c.role] = (byRole[c.role] || 0) + 1;
  return Object.entries(byRole)
    .map(([role, n]) => `${n} × ${role}`)
    .join(' · ') + ` — ${artwork.components.length} pieces total`;
}

/** Instantiate artwork components as placed DesignPieces at garment center. */
function addToDesign(artwork) {
  const p = state.project;
  const ppm = pxPerMm(p);
  const g = p.garment;
  // Drop at the chest area: horizontally centred, upper third of the garment.
  const cx = g.bbox.x + g.bbox.w / 2;
  const cy = g.bbox.y + g.bbox.h * 0.38;
  const groupId = uid('art');
  const groupName = artwork.name;
  const maxLayer = p.pieces.reduce((m, x) => Math.max(m, x.layer), -1);

  artwork.components.forEach((c, i) => {
    const piece = newPiece({
      name: c.name,
      role: c.role,
      group: groupName,
      pathMm: c.pathMm,
      bboxMm: c.bboxMm,
      x: cx + (c.offsetMm?.x ?? 0) * ppm,
      y: cy + (c.offsetMm?.y ?? 0) * ppm,
      rotation: c.rotation ?? 0,
      scale: 1,
      textileId: state.textiles[0]?.id ?? null,
    });
    piece.groupId = groupId;
    piece.layer = maxLayer + 1 + i;
    p.pieces.push(piece);
  });
  saveProject();
}

// ───────────────────────── js/screens/designer.js ─────────────────────────
/**
 * Designer screen (MVP screen 5) — the visual garment canvas.
 *
 * The garment photo is the workspace; pieces render as SVG paths filled with
 * their assigned donor-textile texture. Gestures:
 *   - drag a piece to move it (whole artwork group moves when group mode is on)
 *   - pinch with two fingers to resize + rotate
 *   - mouse: corner handle = resize, top handle = rotate
 * Toolbar: duplicate · mirror · layer up/down · assign textile · group · delete.
 *
 * All edits mutate the production model (mm geometry + placement numbers) and
 * autosave; rendering is derived from that model, never the reverse (§19).
 */




const SVGNS = 'http://www.w3.org/2000/svg';

async function renderDesigner(container) {
  const p = state.project;

  if (!p.garment) {
    container.append(el('div', { class: 'pad' }, el('div', { class: 'empty-state' },
      el('div', { class: 'big' }, '👕'),
      el('div', {}, 'Add a garment photo first.'),
      el('button', { class: 'btn', onclick: () => navigate(`#/p/${p.id}/garment`) }, 'Add garment'))));
    return;
  }

  const img = await loadImage(p.garment.maskImage);
  const W = img.naturalWidth, H = img.naturalHeight;
  const ppm = pxPerMm(p);

  const wrap = el('div', { id: 'designer-wrap' });
  const svg = svgEl('svg', { id: 'designer-svg', viewBox: `0 0 ${W} ${H}` });
  wrap.append(svg);

  const defs = svgEl('defs');
  svg.append(defs);
  svg.append(svgEl('image', { href: p.garment.maskImage, x: 0, y: 0, width: W, height: H }));

  const piecesLayer = svgEl('g', { id: 'pieces' });
  const overlay = svgEl('g', { id: 'overlay' }); // selection handles
  svg.append(piecesLayer, overlay);

  // --- textile fill patterns -------------------------------------------
  const patternIds = new Map();
  function ensurePattern(textileId) {
    if (!textileId) return null;
    if (patternIds.has(textileId)) return patternIds.get(textileId);
    const t = getTextile(textileId);
    if (!t) return null;
    const id = `pat_${textileId}`;
    const tileMm = 80; // pattern tile ≈ 8 cm of fabric (piece-local units are mm)
    const pat = svgEl('pattern', {
      id, patternUnits: 'userSpaceOnUse', width: tileMm, height: tileMm,
    });
    pat.append(svgEl('image', { href: t.swatch, x: 0, y: 0, width: tileMm, height: tileMm, preserveAspectRatio: 'xMidYMid slice' }));
    defs.append(pat);
    patternIds.set(textileId, id);
    return id;
  }

  // --- piece rendering --------------------------------------------------
  const nodeByPiece = new Map();

  function pieceTransform(piece) {
    const s = piece.scale * ppm;
    return `translate(${piece.x} ${piece.y}) rotate(${piece.rotation}) ` +
      `scale(${piece.mirror ? -s : s} ${s})`;
  }

  function renderPieces() {
    piecesLayer.replaceChildren();
    nodeByPiece.clear();
    const sorted = [...p.pieces].sort((a, b) => a.layer - b.layer);
    for (const piece of sorted) {
      const patId = ensurePattern(piece.textileId);
      const g = svgEl('g', { class: 'piece', 'data-id': piece.id, transform: pieceTransform(piece) });
      const path = svgEl('path', {
        class: 'outline',
        d: piece.pathMm,
        fill: patId ? `url(#${patId})` : '#b9917b',
        stroke: 'rgba(0,0,0,.55)',
        'stroke-width': 1.5,
      });
      g.append(path);
      piecesLayer.append(g);
      nodeByPiece.set(piece.id, g);
    }
    updateSelectionUI();
  }

  // --- selection --------------------------------------------------------
  let groupMode = true;

  function selected() {
    return p.pieces.find((x) => x.id === state.selectedPieceId) || null;
  }
  function selectionSet() {
    const s = selected();
    if (!s) return [];
    return groupMode && s.groupId ? p.pieces.filter((x) => x.groupId === s.groupId) : [s];
  }

  function updateSelectionUI() {
    overlay.replaceChildren();
    const s = selected();
    for (const [id, node] of nodeByPiece) {
      node.classList.toggle('selected', !!s && selectionSet().some((x) => x.id === id));
    }
    toolbarState();
    if (!s) { info.textContent = 'Tap a piece to edit it'; return; }
    const wMm = s.bboxMm.w * s.scale, hMm = s.bboxMm.h * s.scale;
    const t = getTextile(s.textileId);
    info.textContent = `${s.name} — ${fmtMm(wMm)} × ${fmtMm(hMm)}` + (t ? ` · ${t.name}` : ' · no material');

    // handles at the piece's transformed bbox corners (manual math keeps us
    // independent of getCTM/viewBox quirks)
    const rad = s.rotation * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const sy = s.scale * ppm;
    const sx = s.mirror ? -sy : sy;
    const pt = (x, y) => ({
      x: s.x + cos * (x * sx) - sin * (y * sy),
      y: s.y + sin * (x * sx) + cos * (y * sy),
    });
    const bb = s.bboxMm;
    const corners = [
      pt(bb.x, bb.y), pt(bb.x + bb.w, bb.y),
      pt(bb.x + bb.w, bb.y + bb.h), pt(bb.x, bb.y + bb.h),
    ];
    const poly = svgEl('polygon', {
      points: corners.map((c) => `${c.x},${c.y}`).join(' '),
      fill: 'none', stroke: '#e8734a', 'stroke-dasharray': '6 4',
      'stroke-width': 2, 'vector-effect': 'non-scaling-stroke',
    });
    overlay.append(poly);

    const hr = Math.max(10, W / 55); // handle radius in svg units
    const scaleHandle = svgEl('circle', {
      class: 'handle', cx: corners[2].x, cy: corners[2].y, r: hr,
    });
    const topMid = { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2 };
    const rotHandle = svgEl('circle', {
      class: 'handle rotate', cx: topMid.x, cy: topMid.y, r: hr,
    });
    scaleHandle.addEventListener('pointerdown', (e) => startHandleGesture(e, 'scale'));
    rotHandle.addEventListener('pointerdown', (e) => startHandleGesture(e, 'rotate'));
    overlay.append(scaleHandle, rotHandle);
  }

  // --- gesture machinery ------------------------------------------------
  const pointers = new Map(); // pointerId → {x, y}
  let gesture = null;

  function svgPoint(e) {
    const m = svg.getScreenCTM().inverse();
    return new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
  }

  function centroidOf(pieces) {
    const n = pieces.length || 1;
    return {
      x: pieces.reduce((a, x) => a + x.x, 0) / n,
      y: pieces.reduce((a, x) => a + x.y, 0) / n,
    };
  }

  svg.addEventListener('pointerdown', (e) => {
    svg.setPointerCapture(e.pointerId);
    const pt = svgPoint(e);
    pointers.set(e.pointerId, pt);

    if (pointers.size === 2 && selected()) {
      // pinch takes over from drag
      const [a, b] = [...pointers.values()];
      const set = selectionSet();
      gesture = {
        kind: 'pinch',
        startDist: Math.hypot(b.x - a.x, b.y - a.y),
        startAngle: Math.atan2(b.y - a.y, b.x - a.x),
        centroid: centroidOf(set),
        snapshot: set.map((x) => ({ id: x.id, x: x.x, y: x.y, scale: x.scale, rotation: x.rotation })),
      };
      return;
    }

    if (gesture?.kind === 'handle') return; // handle gestures own the pointer

    const pieceEl = e.target.closest?.('.piece');
    if (pieceEl) {
      const id = pieceEl.dataset.id;
      if (state.selectedPieceId !== id) {
        state.selectedPieceId = id;
        updateSelectionUI();
      }
      gesture = {
        kind: 'drag', start: pt,
        snapshot: selectionSet().map((x) => ({ id: x.id, x: x.x, y: x.y })),
      };
    } else if (!e.target.closest('.handle')) {
      state.selectedPieceId = null;
      gesture = null;
      updateSelectionUI();
    }
  });

  function startHandleGesture(e, mode) {
    e.stopPropagation();
    svg.setPointerCapture(e.pointerId);
    const s = selected();
    if (!s) return;
    const pt = svgPoint(e);
    const set = selectionSet();
    const c = { x: s.x, y: s.y };
    gesture = {
      kind: 'handle', mode,
      start: pt, center: c,
      startDist: Math.hypot(pt.x - c.x, pt.y - c.y),
      startAngle: Math.atan2(pt.y - c.y, pt.x - c.x),
      centroid: centroidOf(set),
      snapshot: set.map((x) => ({ id: x.id, x: x.x, y: x.y, scale: x.scale, rotation: x.rotation })),
    };
  }

  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId) && gesture?.kind !== 'handle') return;
    const pt = svgPoint(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, pt);
    if (!gesture) return;

    if (gesture.kind === 'drag') {
      const dx = pt.x - gesture.start.x, dy = pt.y - gesture.start.y;
      for (const snap of gesture.snapshot) {
        const piece = p.pieces.find((x) => x.id === snap.id);
        piece.x = snap.x + dx;
        piece.y = snap.y + dy;
        nodeByPiece.get(piece.id)?.setAttribute('transform', pieceTransform(piece));
      }
      liveSelection();
    } else if (gesture.kind === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      applyScaleRotate(dist / gesture.startDist, (angle - gesture.startAngle) * 180 / Math.PI);
    } else if (gesture.kind === 'handle') {
      const c = gesture.center;
      if (gesture.mode === 'scale') {
        const dist = Math.hypot(pt.x - c.x, pt.y - c.y);
        applyScaleRotate(Math.max(0.1, dist / gesture.startDist), 0);
      } else {
        const angle = Math.atan2(pt.y - c.y, pt.x - c.x);
        applyScaleRotate(1, (angle - gesture.startAngle) * 180 / Math.PI);
      }
    }
  });

  function applyScaleRotate(ds, dAngleDeg) {
    const rad = dAngleDeg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const c = gesture.centroid;
    for (const snap of gesture.snapshot) {
      const piece = p.pieces.find((x) => x.id === snap.id);
      if (!piece) continue;
      piece.scale = Math.min(8, Math.max(0.08, snap.scale * ds));
      piece.rotation = snap.rotation + dAngleDeg;
      // orbit position about the gesture centroid so groups stay coherent
      const rx = snap.x - c.x, ry = snap.y - c.y;
      piece.x = c.x + (rx * cos - ry * sin) * ds;
      piece.y = c.y + (rx * sin + ry * cos) * ds;
      nodeByPiece.get(piece.id)?.setAttribute('transform', pieceTransform(piece));
    }
    liveSelection();
  }

  function liveSelection() {
    // cheap live update: redraw handles only (throttled by rAF)
    if (liveSelection.raf) return;
    liveSelection.raf = requestAnimationFrame(() => {
      liveSelection.raf = null;
      updateSelectionUI();
    });
  }

  function endGesture(e) {
    pointers.delete(e.pointerId);
    if (gesture && (pointers.size === 0 || (gesture.kind === 'pinch' && pointers.size < 2))) {
      gesture = null;
      saveProject();
    }
  }
  svg.addEventListener('pointerup', endGesture);
  svg.addEventListener('pointercancel', endGesture);

  // --- toolbar ----------------------------------------------------------
  const info = el('div', { class: 'muted', style: 'padding:6px 14px 0; font-size:12px' }, '');

  const tb = (icon, label, fn) => {
    const b = el('button', { class: 'icon-btn', title: label, 'aria-label': label, onclick: fn }, icon);
    return b;
  };

  const groupBtn = tb('⛓', 'Move whole artwork together', () => {
    groupMode = !groupMode;
    groupBtn.style.color = groupMode ? 'var(--accent)' : '';
    updateSelectionUI();
  });
  groupBtn.style.color = 'var(--accent)';

  const buttons = {
    textile: tb('🧵', 'Assign material', assignTextile),
    duplicate: tb('⧉', 'Duplicate', () => {
      const set = selectionSet();
      if (!set.length) return;
      const newGroup = uid('art');
      let last = null;
      const maxLayer = p.pieces.reduce((m, x) => Math.max(m, x.layer), -1);
      set.forEach((s, i) => {
        const copy = { ...s, id: uid('piece'), x: s.x + 30, y: s.y + 30, groupId: s.groupId ? newGroup : null, layer: maxLayer + 1 + i };
        p.pieces.push(copy);
        last = copy;
      });
      state.selectedPieceId = last.id;
      renderPieces();
      saveProject();
    }),
    mirror: tb('⇋', 'Mirror', () => {
      for (const s of selectionSet()) s.mirror = !s.mirror;
      renderPieces();
      saveProject();
    }),
    up: tb('▲', 'Bring forward', () => bumpLayer(1)),
    down: tb('▼', 'Send backward', () => bumpLayer(-1)),
    del: tb('🗑', 'Delete', () => {
      const ids = new Set(selectionSet().map((x) => x.id));
      if (!ids.size) return;
      p.pieces = p.pieces.filter((x) => !ids.has(x.id));
      state.selectedPieceId = null;
      renderPieces();
      saveProject();
    }),
  };

  function bumpLayer(dir) {
    const set = selectionSet();
    if (!set.length) return;
    for (const s of set) s.layer += dir * (set.length + 0.5);
    // normalize layers to integers preserving order
    [...p.pieces].sort((a, b) => a.layer - b.layer).forEach((x, i) => { x.layer = i; });
    renderPieces();
    saveProject();
  }

  function toolbarState() {
    const has = !!selected();
    for (const b of Object.values(buttons)) b.disabled = !has;
  }

  function assignTextile() {
    const set = selectionSet();
    if (!set.length) return;
    if (!state.textiles.length) {
      appAlert('Photograph a donor textile first (Textiles tab).');
      return;
    }
    const grid = el('div', { class: 'swatch-grid' });
    for (const t of state.textiles) {
      const tile = el('button', { class: 'swatch' + (set[0].textileId === t.id ? ' selected' : '') },
        el('img', { src: t.swatch, alt: t.name }),
        el('span', { class: 'cap' }, t.name));
      tile.addEventListener('click', () => {
        for (const s of set) s.textileId = t.id;
        modal.close();
        renderPieces();
        saveProject();
      });
      grid.append(tile);
    }
    const modal = showModal('Assign material', el('div', {},
      el('div', { class: 'muted', style: 'margin-bottom:10px' },
        groupMode ? 'Applies to the whole selected artwork.' : 'Applies to the selected piece.'),
      grid));
  }

  const toolbar = el('div', { id: 'designer-toolbar' },
    groupBtn, buttons.textile, buttons.duplicate, buttons.mirror,
    buttons.up, buttons.down, buttons.del,
  );

  // --- assemble ---------------------------------------------------------
  const inner = el('div', { class: 'screen-inner' });
  if (!p.pieces.length) {
    inner.append(el('div', { class: 'pad', style: 'padding-bottom:0' },
      el('div', { class: 'card' },
        el('div', { class: 'muted' }, 'No artwork on the garment yet.'),
        el('div', { class: 'btn-row', style: 'margin-bottom:0' },
          el('button', { class: 'btn small', onclick: () => navigate(`#/p/${p.id}/artwork`) }, '+ Add artwork')))));
  }
  inner.append(info, wrap, toolbar);
  container.append(inner);

  renderPieces();
}

// ───────────────────────── js/screens/preview.js ─────────────────────────
/**
 * Preview screen (MVP screen 6) — realistic mockup of the finished piece.
 *
 * Local compositing pipeline (the ai.js adapter can swap in an image-model
 * renderer later): real textile textures fill each piece, the garment
 * photo's own luminance is multiplied back over the appliqué so wrinkles,
 * seams and folds show through, a soft shadow suggests fabric thickness,
 * and a dashed inset line simulates appliqué stitching.
 *
 * §19 guarantee: this screen READS the production model and writes only a
 * cached image (`project.previewImage`). It never alters geometry.
 */




async function renderPreview(container) {
  const p = state.project;
  const pad = el('div', { class: 'pad' });
  container.append(pad);

  if (!p.garment || !p.pieces.length) {
    pad.append(el('div', { class: 'empty-state' },
      el('div', { class: 'big' }, '👁'),
      el('div', {}, 'Place some artwork on the garment first.'),
      el('button', { class: 'btn', onclick: () => navigate(`#/p/${p.id}/designer`) }, 'Open designer')));
    return;
  }

  pad.append(el('div', { class: 'empty-state' }, el('div', { class: 'big' }, '🪄'), el('div', {}, 'Rendering mockup…')));

  const dataUrl = await renderMockup(p);
  p.previewImage = dataUrl;
  saveProject();

  pad.replaceChildren(
    el('div', { class: 'photo-frame' }, el('img', { src: dataUrl, alt: 'Mockup of the finished garment' })),
    el('div', { class: 'card' },
      el('h3', {}, 'Happy with it?'),
      el('div', { class: 'muted' },
        'This preview is a visualization. The cutting patterns are generated from the exact design geometry, not from this image.'),
    ),
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn secondary', onclick: () => navigate(`#/p/${p.id}/designer`) }, '← Keep editing'),
      el('button', { class: 'btn', onclick: () => navigate(`#/p/${p.id}/make`) }, 'Make it →'),
    ),
  );
}

async function renderMockup(p) {
  const garmentImg = await loadImage(p.garment.maskImage);
  const W = garmentImg.naturalWidth, H = garmentImg.naturalHeight;
  const ppm = pxPerMm(p);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // neutral studio backdrop so the mockup reads as a product photo
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#efece7');
  grad.addColorStop(1, '#d9d4cc');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.drawImage(garmentImg, 0, 0);

  // pre-render a grayscale copy of the garment for shading passes
  const shade = document.createElement('canvas');
  shade.width = W; shade.height = H;
  const sctx = shade.getContext('2d');
  sctx.filter = 'grayscale(1) brightness(1.25) contrast(0.9)';
  sctx.drawImage(garmentImg, 0, 0);

  const swatchCache = new Map();
  async function swatchImage(textileId) {
    if (!swatchCache.has(textileId)) {
      const t = getTextile(textileId);
      swatchCache.set(textileId, t ? await loadImage(t.swatch) : null);
    }
    return swatchCache.get(textileId);
  }

  const sorted = [...p.pieces].sort((a, b) => a.layer - b.layer);
  for (const piece of sorted) {
    const path = new Path2D(piece.pathMm);
    const s = piece.scale * ppm;
    const apply = (c) => {
      c.translate(piece.x, piece.y);
      c.rotate(piece.rotation * Math.PI / 180);
      c.scale(piece.mirror ? -s : s, s);
    };

    // 1. fabric thickness: soft drop shadow under the piece
    ctx.save();
    apply(ctx);
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 2 * ppm; // shadow params are in device px, not local units
    ctx.shadowOffsetX = 0.8 * ppm;
    ctx.shadowOffsetY = 1.2 * ppm;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill(path);
    ctx.restore();

    // 2. textile texture fill (texture density is per-mm, independent of
    //    piece scale, like real printed fabric)
    ctx.save();
    apply(ctx);
    ctx.clip(path);
    const sw = await swatchImage(piece.textileId);
    if (sw) {
      const pat = ctx.createPattern(sw, 'repeat');
      const tileMm = 80;
      const m = new DOMMatrix().scale(tileMm / sw.width / piece.scale);
      pat.setTransform(m);
      ctx.fillStyle = pat;
    } else {
      ctx.fillStyle = '#b9917b';
    }
    const bb = piece.bboxMm;
    ctx.fillRect(bb.x - 2, bb.y - 2, bb.w + 4, bb.h + 4);
    ctx.restore();

    // 3. garment shading multiplied over the piece: wrinkles/folds show through
    ctx.save();
    apply(ctx);
    ctx.clip(path);
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.5;
    // draw the grayscale garment in garment-image space: undo piece transform
    ctx.scale(piece.mirror ? -1 / s : 1 / s, 1 / s);
    ctx.rotate(-piece.rotation * Math.PI / 180);
    ctx.translate(-piece.x, -piece.y);
    ctx.drawImage(shade, 0, 0);
    ctx.restore();

    // 4. appliqué stitching: dashed inset line around the edge
    ctx.save();
    apply(ctx);
    const cbx = bb.x + bb.w / 2, cby = bb.y + bb.h / 2;
    ctx.translate(cbx, cby);
    ctx.scale(0.93, 0.93);
    ctx.translate(-cbx, -cby);
    ctx.strokeStyle = 'rgba(35,28,22,0.85)';
    ctx.lineWidth = 0.9;
    ctx.setLineDash([2.6, 1.8]);
    ctx.stroke(path);
    ctx.restore();

    // 5. raw fabric edge: thin light line right on the cut edge
    ctx.save();
    apply(ctx);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 0.5;
    ctx.stroke(path);
    ctx.restore();
  }

  return canvas.toDataURL('image/jpeg', 0.9);
}

// ───────────────────────── js/screens/make.js ─────────────────────────
/**
 * Make screen (MVP screen 7) — production mode.
 *
 * Converts the approved design into physical cutting patterns (§7–9):
 *   - a cut list: every piece with true dimensions, material, layer order
 *   - per-material nested cutting layouts with a utilization estimate
 *   - exportable real-size SVG cutting sheets (Cricut/Silhouette/laser/hand)
 *   - assembly notes (layer order = sewing order)
 */






async function renderMake(container) {
  const p = state.project;
  const pad = el('div', { class: 'pad' });
  container.append(pad);

  if (!p.pieces.length) {
    pad.append(el('div', { class: 'empty-state' },
      el('div', { class: 'big' }, '✂️'),
      el('div', {}, 'Nothing to cut yet — design something first.'),
      el('button', { class: 'btn', onclick: () => navigate(`#/p/${p.id}/designer`) }, 'Open designer')));
    return;
  }

  // ---- seam allowance option ------------------------------------------
  const seamInput = el('input', { type: 'number', min: 0, max: 15, step: 0.5, value: p.seamAllowanceMm ?? 0 });
  seamInput.addEventListener('change', () => {
    p.seamAllowanceMm = parseFloat(seamInput.value) || 0;
    saveProject();
    redraw();
  });

  pad.append(el('div', { class: 'card' },
    el('h3', {}, 'Production settings'),
    el('label', { class: 'field' }, 'Seam / stitch allowance (mm, 0 = raw-edge appliqué)', seamInput),
    el('div', { class: 'small-note' },
      'Allowance is drawn as a second dashed outline around each piece (approximate uniform offset in this version).'),
  ));

  const body = el('div', {});
  pad.append(body);
  redraw();

  function redraw() {
    body.replaceChildren();

    // ---- cut list ------------------------------------------------------
    const sorted = [...p.pieces].sort((a, b) => a.layer - b.layer);
    const table = el('table', { class: 'piece-list' },
      el('thead', {}, el('tr', {},
        el('th', {}, '#'), el('th', {}, 'Piece'), el('th', {}, 'Size'),
        el('th', {}, 'Material'), el('th', {}, 'Sew order'))),
    );
    const tbody = el('tbody');
    sorted.forEach((piece, i) => {
      const t = getTextile(piece.textileId);
      tbody.append(el('tr', {},
        el('td', {}, String(i + 1)),
        el('td', {}, `${piece.group ? piece.group + ' · ' : ''}${piece.name}${piece.mirror ? ' (mirrored)' : ''}`),
        el('td', {}, `${fmtMm(piece.bboxMm.w * piece.scale)} × ${fmtMm(piece.bboxMm.h * piece.scale)}`),
        el('td', {}, t ? t.name : el('span', { style: 'color:var(--danger)' }, 'unassigned!')),
        el('td', {}, String(i + 1)),
      ));
    });
    table.append(tbody);
    body.append(
      el('div', { class: 'section-title' }, `Cut list — ${sorted.length} pieces`),
      el('div', { style: 'overflow-x:auto' }, table),
      el('div', { class: 'small-note' }, 'Sew order = layer order from the designer: bottom pieces first.'),
    );

    // ---- per-material nesting + export --------------------------------
    const byTextile = new Map();
    for (const piece of sorted) {
      const key = piece.textileId || 'unassigned';
      if (!byTextile.has(key)) byTextile.set(key, []);
      byTextile.get(key).push(piece);
    }

    body.append(el('div', { class: 'section-title' }, 'Cutting sheets by material'));

    for (const [textileId, pieces] of byTextile) {
      const t = getTextile(textileId);
      const matName = t ? t.name : 'Unassigned material';

      const nestInput = pieces.map((piece) => ({
        id: piece.id,
        label: piece.name,
        wMm: piece.bboxMm.w * piece.scale + 2 * (p.seamAllowanceMm || 0),
        hMm: piece.bboxMm.h * piece.scale + 2 * (p.seamAllowanceMm || 0),
      }));
      const sheetW = 450; // default usable width of a laid-flat donor garment
      const nested = nestPieces(nestInput, sheetW);

      const exportPieces = pieces.map((piece) => ({
        id: piece.id,
        label: piece.name,
        pathMm: piece.pathMm,
        scale: piece.scale,
        mirror: piece.mirror,
        seamAllowanceMm: p.seamAllowanceMm || 0,
      }));
      const svgText = buildCuttingSheetSVG({
        pieces: exportPieces,
        placements: nested.placements,
        sheetWMm: nested.sheetWMm,
        usedHMm: nested.usedHMm + 8,
        materialName: matName,
      });

      const sheetAreaMm2 = nested.sheetWMm * nested.usedHMm;
      const remainingNote = t
        ? ` · you estimated ${fmtArea(t.estimatedAreaM2 * 1e6)} of this material`
        : '';

      const holder = el('div', { class: 'layout-preview', html: svgText });

      body.append(el('div', { class: 'card' },
        el('h3', {}, `${matName} `, el('span', { class: 'pill' }, `${pieces.length} pieces`)),
        el('div', { class: 'muted' },
          `Layout: ${fmtMm(nested.sheetWMm)} wide × ${fmtMm(nested.usedHMm)} — ` +
          `estimated material utilization ${(nested.utilization * 100).toFixed(0)}%` +
          ` (${fmtArea(sheetAreaMm2)} consumed${remainingNote})`),
        holder,
        el('div', { class: 'btn-row' },
          el('button', {
            class: 'btn small',
            onclick: () => downloadText(fileSafe(`${p.name}-${matName}-cutsheet.svg`), svgText),
          }, '⬇ Cutting sheet SVG'),
          el('button', {
            class: 'btn small secondary',
            onclick: () => exportIndividual(pieces, matName),
          }, '⬇ Individual pieces'),
        ),
        !t ? el('div', { class: 'small-note', style: 'color:var(--danger)' },
          'Assign a donor textile to these pieces in the designer.') : null,
      ));
    }

    body.append(el('div', { class: 'card' },
      el('h3', {}, 'Using the files'),
      el('div', { class: 'muted', html:
        'Exported SVGs are true-to-size (1&nbsp;unit&nbsp;=&nbsp;1&nbsp;mm). Import into ' +
        '<b>Cricut Design Space</b>, <b>Silhouette Studio</b>, <b>Brother CanvasWorkspace</b> ' +
        'or any laser/vinyl software — or print at 100% scale for hand cutting. ' +
        'Pin or fuse each piece to its donor fabric, cut on the solid line, ' +
        'then attach in the sew order shown above.' }),
    ));
  }

  function exportIndividual(pieces, matName) {
    const list = el('div', {});
    for (const piece of pieces) {
      list.append(el('div', { class: 'btn-row' },
        el('button', {
          class: 'btn small secondary',
          onclick: () => downloadText(
            fileSafe(`${piece.group || 'piece'}-${piece.name}.svg`),
            buildPieceSVG({ label: piece.name, pathMm: piece.pathMm, scale: piece.scale, mirror: piece.mirror })),
        }, `⬇ ${piece.name} (${fmtMm(piece.bboxMm.w * piece.scale)} × ${fmtMm(piece.bboxMm.h * piece.scale)})`)));
    }
    showModal(`${matName} — individual pieces`, list);
  }
}

function fileSafe(name) {
  return name.replace(/[^\w.-]+/g, '_');
}

// ───────────────────────── js/app.js ─────────────────────────
/**
 * app.js — hash router + app shell.
 *
 * Routes:
 *   #/projects            project list (home)
 *   #/p/<id>/<tab>        project workspace tabs:
 *                         garment | textile | artwork | designer | preview | make
 */









const SCREENS = {
  garment: { title: 'Base garment', render: renderGarment },
  textile: { title: 'Donor textiles', render: renderTextile },
  artwork: { title: 'Artwork', render: renderArtwork },
  designer: { title: 'Designer', render: renderDesigner },
  preview: { title: 'Preview', render: renderPreview },
  make: { title: 'Make', render: renderMake },
};

const $screen = () => document.getElementById('screen');
const $title = () => document.getElementById('screen-title');
const $tabbar = () => document.getElementById('tabbar');
const $back = () => document.getElementById('back-btn');

function navigate(hash) {
  location.hash = hash;
}

async function route() {
  const hash = location.hash || '#/projects';
  const parts = hash.replace(/^#\//, '').split('/');
  const container = $screen();
  container.replaceChildren();
  window.scrollTo(0, 0);

  await loadTextiles();

  if (parts[0] === 'p' && parts[1]) {
    const tab = SCREENS[parts[2]] ? parts[2] : 'garment';
    if (!state.project || state.project.id !== parts[1]) {
      const proj = await loadProject(parts[1]);
      if (!proj) { navigate('#/projects'); return; }
    }
    $title().textContent = state.project.name;
    $back().hidden = false;
    $back().onclick = () => navigate('#/projects');
    const bar = $tabbar();
    bar.hidden = false;
    bar.querySelectorAll('.tab').forEach((b) => {
      b.classList.toggle('active', b.dataset.tab === tab);
      b.onclick = () => navigate(`#/p/${state.project.id}/${b.dataset.tab}`);
    });
    await SCREENS[tab].render(container);
  } else {
    state.project = null;
    $title().textContent = 'ReStitch';
    $back().hidden = true;
    $tabbar().hidden = true;
    await renderProjects(container);
  }
}

window.addEventListener('hashchange', route);
route();
</script>
